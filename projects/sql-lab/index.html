<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PGlite (PostgreSQL kompilert til WebAssembly) lastes fra jsDelivr, derfor de to unntakene i CSP-en. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; connect-src 'self' https://cdn.jsdelivr.net https://*.goatcounter.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
  <title>SQL-lab: PostgreSQL i nettleseren</title>
  <meta name="description" content="Skriv SQL mot en ekte PostgreSQL-database som kjører i nettleseren. Se resultatet som tabell eller diagram, og få spørreplanen tegnet som et tre.">
  <meta property="og:url" content="https://in-prosjekter.pages.dev/projects/sql-lab/">
  <link rel="canonical" href="https://in-prosjekter.pages.dev/projects/sql-lab/">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="icon" href="../../favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <link rel="manifest" href="../../site.webmanifest">
  <meta name="theme-color" content="#0a0c0b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ibrahim Nur">
  <meta property="og:title" content="SQL-lab: PostgreSQL i nettleseren">
  <meta property="og:description" content="Skriv SQL mot en ekte PostgreSQL-database som kjører i nettleseren. Se resultatet som tabell eller diagram, og få spørreplanen tegnet som et tre.">
  <meta property="og:locale" content="nb_NO">
  <meta property="og:image" content="https://in-prosjekter.pages.dev/assets/og/sql-lab.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="../../assets/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/app.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../assets/js/theme-init.js"></script>
  <script type="module" src="../../assets/js/app-shell.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body data-project="sql-lab">
  <main class="app" id="app">
    <header class="app-intro">
      <p class="eyebrow">PostgreSQL · WebAssembly</p>
      <h1>SQL-lab</h1>
      <p>En ekte PostgreSQL-database i nettleseren din. Datasettet er syntetisk: 24 stasjoner, 3&nbsp;000 medlemmer og 40&nbsp;000 bysykkelturer.</p>
    </header>

    <div class="lab">
      <aside class="side">
        <section class="panel">
          <h2 class="panel-title">Eksempler</h2>
          <ul class="examples" id="examples"></ul>
        </section>
        <section class="panel">
          <h2 class="panel-title">Tabeller</h2>
          <div class="schema" id="schema"><p class="hint">Laster...</p></div>
        </section>
      </aside>

      <section class="work" aria-label="Spørring og resultat">
        <div class="panel editor-panel">
          <label class="sr-only" for="editor">SQL-spørring</label>
          <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" rows="12"></textarea>
          <div class="toolbar editor-actions">
            <button class="btn btn-primary" id="run" type="button" disabled>Kjør</button>
            <button class="btn btn-ghost" id="plan" type="button" disabled>Vis plan</button>
            <button class="btn btn-ghost" id="reset" type="button" disabled>Tilbakestill databasen</button>
            <span class="hint keys"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> kjører</span>
          </div>
        </div>

        <p class="state" id="state" role="status" aria-live="polite">Starter PostgreSQL (laster ned ca. 5 MB første gang)...</p>
        <p class="error" id="error" role="alert" hidden></p>

        <div class="panel result" id="result" hidden>
          <div class="result-head">
            <div class="seg" role="radiogroup" aria-label="Visning" id="view">
              <label><input type="radio" name="view" value="table" checked><span>Tabell</span></label>
              <label><input type="radio" name="view" value="chart"><span>Diagram</span></label>
              <label><input type="radio" name="view" value="plan"><span>Plan</span></label>
            </div>
            <p class="hint" id="meta"></p>
          </div>
          <div class="view" id="view-table"></div>
          <div class="view" id="view-chart" hidden></div>
          <div class="view" id="view-plan" hidden></div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
