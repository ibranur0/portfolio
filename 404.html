<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fant ikke siden · Ibrahim Nur</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; background: #0a0c0b; color: #e9ece8; font-family: system-ui, sans-serif; }
    h1 { margin: 0; font: 400 clamp(96px, 26vw, 220px)/1.15 Georgia, serif; color: #45d98b; }
    p { margin: 0; color: #939b95; text-wrap: balance; }
    a { margin-top: 12px; padding: 12px 22px; border: 1px solid #3b423e; border-radius: 999px; color: inherit; text-decoration: none; }
    a:hover { border-color: #e9ece8; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Siden du lette etter, finnes ikke.</p>
  <a id="home" href="/">← Tilbake til porteføljen</a>
  <script>
    // På GitHub Pages ligger siden under /<repo>/, så lenken tilbake må peke dit.
    var parts = location.pathname.split('/').filter(Boolean);
    if (location.hostname.endsWith('github.io') && parts.length) {
      document.getElementById('home').href = '/' + parts[0] + '/';
      document.querySelector('link[rel=icon]').href = '/' + parts[0] + '/favicon.svg?v=2';
    }
  </script>
</body>
</html>
